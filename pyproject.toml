[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "padic-ml"
dynamic = ["version"]
description = "JAX library for differentiable training of p-adic neural networks"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Padic ML Authors"}]
keywords = ["jax", "p-adic", "berkovich", "machine learning", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax",
    "jaxtyping",
    "sympy",
]

[project.urls]
Homepage = "https://github.com/google-deepmind/padic-ml"
Repository = "https://github.com/google-deepmind/padic-ml"

[project.optional-dependencies]
test = [
    "absl-py",
    "numpy",
]

[tool.setuptools]
packages = ["padic_ml"]

[tool.setuptools.dynamic]
version = {attr = "padic_ml.__version__"}
