name: pypi

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine build keyring keyrings.google-artifactregistry-auth
    - name: Check consistency between the package version and release tag
      run: |
        pip install .
        RELEASE_VER=${GITHUB_REF#refs/*/}
        PACKAGE_VER="v`python -c 'import padic_ml; print(padic_ml.__version__)'`"
        if [ $RELEASE_VER != $PACKAGE_VER ]
        then
          echo "package ver. ($PACKAGE_VER) != release ver. ($RELEASE_VER)"; exit 1
        fi
    - name: Build
      run: |
        python -m build
    - name: Authenticate to OSS Exit Gate
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
    - name: Stage package distributions in OSS Exit Gate Artifact Registry
      run: |
        python -m twine upload \
          --repository-url https://us-python.pkg.dev/oss-exit-gate-prod/padic-ml--pypi \
          dist/*
    - name: Trigger OSS Exit Gate release
      run: |
        echo '{"publish_all": true}' > publish_all.json
        gcloud storage cp publish_all.json \
          "gs://oss-exit-gate-prod-projects-bucket/padic-ml/pypi/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
